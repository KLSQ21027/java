<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Javascript Homework</h2>
    <p id = "operators"></p>
    <script>
        var x,y,z,w,v,u; 
        x = 10; 
        y = 2; 
        z = x + y; 
        w = x - y;
        v = x * y;
        u = x / y;
        document.getElementById("operators").innerHTML =
        "The value of z is :" + z + ". " +
        "The value of w is :" + w + ". " +
        "The value of v is :" + v + ". " +
        "The value of u is :" + u + ". ";
    </script>
</body>
</html>
